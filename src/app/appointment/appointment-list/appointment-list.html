<table mat-table [dataSource]="appointmentRecords" class="mat-elevation-z8">
  <!--- Note that these columns can be defined in any order.
          The actual rendered columns are set as a property on the row definition" -->

  <!-- Position Column -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>No.</th>
    <td mat-cell *matCellDef="let element">{{ element.id }}</td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="patientName">
    <th mat-header-cell *matHeaderCellDef>Patient Name</th>
    <td mat-cell *matCellDef="let element">{{ element.patientName }}</td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="doctorName">
    <th mat-header-cell *matHeaderCellDef>Doctor Name</th>
    <td mat-cell *matCellDef="let element">{{ element.doctorName }}</td>
  </ng-container>

  <!-- Symbol Column -->
  <ng-container matColumnDef="appointmentTime">
    <th mat-header-cell *matHeaderCellDef>Appointment Time</th>
    <td mat-cell *matCellDef="let element">{{ element.appointmentTime }}</td>
  </ng-container>

  <ng-container matColumnDef="reason">
    <th mat-header-cell *matHeaderCellDef>Reason</th>
    <td mat-cell *matCellDef="let element">{{ element.reason }}</td>
  </ng-container>

  <ng-container matColumnDef="appointmentStatus">
    <th mat-header-cell *matHeaderCellDef>Appointment Status</th>
    <td mat-cell *matCellDef="let element">{{ element.appointmentStatus }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

<div *ngIf="appointmentRecords.length === 0" class="text-center mt-4">No record found</div>
