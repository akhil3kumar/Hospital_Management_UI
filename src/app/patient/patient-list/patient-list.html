<table class="table table-hover table-striped table-bordered">
  <thead>
    <tr>
      <th>Patient Id</th>
      <th>Name</th>
      <th>Age</th>
      <th>Disease</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let patient of patientsResponse">
      <td>{{ patient.id }}</td>
      <td>{{ patient.name }}</td>
      <td>{{ patient.age }}</td>
      <td>{{ patient.disease }}</td>
      <td>
        <button type="button" (click)="updateButton(patient.id)" class="btn btn-warning">
          Edit
        </button>
        <button type="button" (click)="deleteButton(patient.id)" class="btn btn-danger">
          Delete
        </button>
      </td>
    </tr>
  </tbody>
</table>
